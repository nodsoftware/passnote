name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchain. Keep this in sync with .fvmrc (see README "Development").
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable

      - run: dart pub global activate melos

      - run: melos bootstrap

      - run: melos run format

      - run: melos run analyze

      - run: melos run test
