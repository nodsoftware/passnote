name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package:sqlite3 bundles its native library through build hooks; the
      # workspace pubspec pins the SQLCipher source (hooks.user_defines), so
      # every keyed-engine test runs against real at-rest encryption and
      # sqlite_encryption_test.dart fails the build if that wiring breaks.

      # Pinned toolchain. Keep this in sync with .fvmrc (see README "Development").
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable

      # Pinned melos (config lives in pubspec.yaml; keep in sync with README).
      - run: dart pub global activate melos 7.8.2

      - run: melos bootstrap

      # Regenerate the annotated document models (passnote_generator) and fail
      # on drift: generated *.g.dart files are checked in and must match their
      # committed sources.
      - run: melos run generate
      - run: git diff --exit-code

      - run: melos run format

      - run: melos run analyze

      # Runs test:dart, then test:flutter, then a check that every package with
      # a test/ dir was picked up by one of them (a runner-wiring check, not a
      # coverage measurement — no line coverage is collected).
      - run: melos run test

      # The mDNS loopback integration test: two LanTransports discover each
      # other over multicast on the runner and exchange a frame. Socket-bound,
      # so it is tagged and skipped in the default unit run.
      #
      # Linux alone cannot vouch for this: the multicast options mDNS needs
      # differ per platform, and a bind that Linux accepts can be refused on a
      # host that runs its own responder. The macOS job below covers that.
      - name: LAN transport integration
        run: dart test --run-skipped -t integration
        working-directory: packages/passnote_lan

      # Every package must stay publishable at all times. (pana runs after
      # publication on pub.dev; it cannot score the dependent packages before
      # `passnote` exists there.)
      - name: Publish dry-run
        run: |
          for p in passnote passnote_crypto passnote_lan passnote_generator passnote_flutter; do
            (cd "packages/$p" && flutter pub publish --dry-run)
          done

      # Web: prove passnote and passnote_crypto compile to JS (no dart:io
      # leak), then run the CrdtTable conformance suite against the wasm engine
      # in headless Chrome.
      - name: Web build check
        run: |
          dart compile js -o /tmp/core.js packages/passnote/tool/web_compile_check.dart
          dart compile js -o /tmp/crypto.js packages/passnote_crypto/tool/web_compile_check.dart
          dart compile js -o /tmp/lan.js packages/passnote_lan/tool/web_compile_check.dart
      - name: Fetch sqlite3.wasm
        run: curl -sSL -o packages/passnote/test/web/sqlite3.wasm https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.5.2/sqlite3.wasm
      - name: Web conformance (headless Chrome)
        run: dart test -P web
        working-directory: packages/passnote
      - name: Web transport (headless Chrome, hybrid native peer)
        run: dart test -P web
        working-directory: packages/passnote_lan

      # Docs: build the site with the pinned Zensical and fail on any broken
      # internal link.
      - name: Docs build and link check
        run: |
          pip install zensical==0.0.60
          zensical build
          dart run tool/check_doc_links.dart

      # At-rest encryption wiring: the SQLCipher build hook must be present in
      # the workspace root (so tests run encrypted), in every example (they
      # are meant to be copied out, where only their own root pubspec counts),
      # and in the tutorial's install step. The engine fails closed without
      # it, so a missing stanza means examples throw on first launch.
      - name: SQLCipher stanza check
        run: |
          fail=0
          for f in pubspec.yaml examples/*/pubspec.yaml docs/start-here/tutorial.md; do
            grep -q "source: sqlcipher" "$f" || { echo "::error::$f lacks the SQLCipher hooks stanza"; fail=1; }
          done
          exit $fail

      # House style: at most 2 em-dashes per docs page (commas, parentheses,
      # or sentence breaks carry the rest).
      - name: Docs em-dash ceiling
        run: |
          fail=0
          for f in $(find docs -name '*.md'); do
            n=$(grep -o "—" "$f" | wc -l)
            if [ "$n" -gt 2 ]; then echo "$f has $n em-dashes (max 2)"; fail=1; fi
          done
          exit $fail

      # Asserts the disk-backed engine's resident memory stays bounded as the
      # dataset grows, and that MapCrdtTable does not (the contrast).
      - name: Memory bounds benchmark
        run: dart test --run-skipped -t benchmark
        working-directory: packages/passnote

      # The generator's analyzer constraint spans several majors, but inside
      # this workspace the Flutter SDK's `meta` pin caps analyzer below what
      # a user's fresh `dart pub get` resolves — so a consumer package
      # OUTSIDE the workspace generates a model against the newest allowed
      # analyzer (the displayName → Class.new kind of break fails here, not
      # at the user's machine).
      - name: Fresh user resolution (generator + core smoke)
        run: bash tool/check-generator-fresh-resolve.sh

  # mDNS on an Apple host, which is the only place some of its failure modes
  # appear. macOS runs its own mDNSResponder and already holds UDP 5353, so a
  # responder that binds it without SO_REUSEPORT is refused with
  # "Address already in use" — while the same bind succeeds on Linux, where
  # nothing contends for the port. Only this job sees that difference.
  mdns-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with the ci job above and .fvmrc.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable

      - run: dart pub global activate melos 7.8.2
      - run: melos bootstrap

      - name: LAN transport integration (macOS)
        run: dart test --run-skipped -t integration
        working-directory: packages/passnote_lan
