name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package:sqlite3 links the system SQLite. The keyed-engine test also
      # exercises a SQLCipher build when one is present.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlcipher libsqlcipher-dev

      # Pinned toolchain. Keep this in sync with .fvmrc (see README "Development").
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable

      # Pinned melos (config lives in pubspec.yaml; keep in sync with README).
      - run: dart pub global activate melos 7.8.2

      - run: melos bootstrap

      # Regenerate the annotated document models (conclave_generator) and fail
      # on drift: generated *.g.dart files are checked in and must match their
      # committed sources.
      - run: melos run generate
      - run: git diff --exit-code

      - run: melos run format

      - run: melos run analyze

      # Runs test:dart, then test:flutter, then a check that every package with
      # a test/ dir was picked up by one of them.
      - run: melos run test

      # Web: prove conclave and conclave_crypto compile to JS (no dart:io
      # leak), then run the CrdtTable conformance suite against the wasm engine
      # in headless Chrome.
      - name: Web build check
        run: |
          dart compile js -o /tmp/core.js packages/conclave/tool/web_compile_check.dart
          dart compile js -o /tmp/crypto.js packages/conclave_crypto/tool/web_compile_check.dart
          dart compile js -o /tmp/lan.js packages/conclave_lan/tool/web_compile_check.dart
      - name: Fetch sqlite3.wasm
        run: curl -sSL -o packages/conclave/test/web/sqlite3.wasm https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-2.9.4/sqlite3.wasm
      - name: Web conformance (headless Chrome)
        run: dart test -P web
        working-directory: packages/conclave
      - name: Web transport (headless Chrome, hybrid native peer)
        run: dart test -P web
        working-directory: packages/conclave_lan

      # Docs: build the site with the pinned Zensical and fail on any broken
      # internal link.
      - name: Docs build and link check
        run: |
          pip install zensical==0.0.60
          zensical build
          dart run tool/check_doc_links.dart

      # Asserts the disk-backed engine's resident memory stays bounded as the
      # dataset grows, and that MapCrdtTable does not (the contrast).
      - name: Memory bounds benchmark
        run: dart test --run-skipped -t benchmark
        working-directory: packages/conclave
