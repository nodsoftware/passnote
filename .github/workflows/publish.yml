# Publishes every package to pub.dev when a release tag is pushed.
#
# Authentication is GitHub OIDC (no long-lived secrets): each package on
# pub.dev is configured for automated publishing from this repository with
# the tag pattern `v{{version}}`, and the job's `id-token: write` permission
# lets `pub` exchange the Actions token. Packages publish in dependency
# order so pub.dev can resolve each one as it lands.
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: github.repository == 'nodsoftware/passnote'
    runs-on: ubuntu-latest
    # Without credentials `pub publish` waits for an interactive login that
    # never comes; the 1.0.0 run sat on that until the 6-hour job limit.
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Exchanges the job's OIDC token for pub.dev credentials. flutter-action
      # does not, and `flutter pub publish` reads the same pub config, so this
      # must come first.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - name: Publish passnote
        run: flutter pub publish --force
        working-directory: packages/passnote
      - name: Publish passnote_crypto
        run: flutter pub publish --force
        working-directory: packages/passnote_crypto
      - name: Publish passnote_lan
        run: flutter pub publish --force
        working-directory: packages/passnote_lan
      - name: Publish passnote_generator
        run: flutter pub publish --force
        working-directory: packages/passnote_generator
      - name: Publish passnote_flutter
        run: flutter pub publish --force
        working-directory: packages/passnote_flutter
