name: conclave

packages:
  - packages/**
  - examples/**

command:
  bootstrap:
    usePubWorkspace: true

scripts:
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 4

  format:
    run: dart format --output=none --set-exit-if-changed .

  test:
    run: dart test
    exec:
      concurrency: 2
    packageFilters:
      dirExists: test
