name: passnote_workspace
publish_to: none
environment:
  sdk: ^3.6.0
dev_dependencies:
  melos: ^7.8.0

# Build package:sqlite3's native library from the SQLCipher source so every
# test in the workspace runs against real at-rest encryption. Apps make the
# same choice in their own root pubspec (see docs/guides/set-up-platforms.md);
# the engine refuses to open an encrypted database without it.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
workspace:
  - packages/passnote
  - packages/passnote_crypto
  - packages/passnote_generator
  - packages/passnote_lan
  - packages/passnote_flutter
  - examples/quickstart
  - examples/shopping_list_provider
  - examples/shopping_list_bloc
  - examples/cli_logbook

# Melos config lives here (not melos.yaml): melos 7 with a pub `workspace:`
# reads its config from pubspec.yaml.
melos:
  command:
    bootstrap:
      usePubWorkspace: true

  scripts:
    analyze:
      run: dart analyze --fatal-infos
      exec:
        concurrency: 4

    format:
      run: dart format --output=none --set-exit-if-changed .

    # Regenerates every package that uses passnote_generator (annotated
    # document models). Generated *.g.dart files are checked in; CI runs this
    # and fails on drift.
    generate:
      exec:
        concurrency: 1
      run: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    # Runs each package's tests with the runner it needs (Flutter packages
    # cannot be tested with `dart test`), then checks nothing slipped through.
    test:
      steps:
        - test:dart
        - test:flutter
        - test:wiring-check

    test:dart:
      run: dart test
      exec:
        concurrency: 2
      packageFilters:
        dirExists: test
        flutter: false

    test:flutter:
      run: flutter test
      exec:
        # Flutter holds a global startup lock, so its packages run one at a time.
        concurrency: 1
      packageFilters:
        dirExists: test
        flutter: true

    # Not a coverage measurement: verifies every package with a test/ dir is
    # matched by one of the two test runners above.
    test:wiring-check:
      run: bash tool/check-test-wiring.sh
