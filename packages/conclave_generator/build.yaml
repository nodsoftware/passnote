builders:
  conclave_generator:
    import: "package:conclave_generator/conclave_generator.dart"
    builder_factories: ["conclaveGenerator"]
    build_extensions: { ".dart": [".conclave.g.part"] }
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen:combining_builder"]

# Apply the builder to this package's own test fixtures, so the generator is
# exercised for real (generate, compile, run) by its own test suite.
targets:
  $default:
    builders:
      conclave_generator:conclave_generator:
        enabled: true
        generate_for: ["test/src/*.dart"]
