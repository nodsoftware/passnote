name: conclave_crypto
version: 1.0.0
description: >-
  Crypto for Conclave: XChaCha20-Poly1305, Argon2id key derivation from a
  BIP39 passphrase, X25519/Ed25519 device identity, and SPAKE2 pairing.
homepage: https://github.com/nodsoftware/conclave
repository: https://github.com/nodsoftware/conclave
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  bip39: ^1.0.6
  conclave: ^1.0.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  meta: ^1.18.0
  pointycastle: ^3.9.1

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
