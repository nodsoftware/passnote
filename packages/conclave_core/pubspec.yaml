name: conclave_core
version: 0.1.0
description: >-
  Pure-Dart core for Conclave: port interfaces, CRDT engine, encrypted-store
  decorator, typed collections, and in-memory transport for testing.
homepage: https://github.com/nodsoftware/conclave
repository: https://github.com/nodsoftware/conclave

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  crdt: ^5.1.3
  crypto: ^3.0.6
  sqlite3: ^2.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
