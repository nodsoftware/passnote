# `@TestOn('browser')` tests need Chrome and a served sqlite3.wasm. The default
# `dart test` (VM) run skips them; `dart test -P web` runs just `test/web/` in
# headless Chrome.
presets:
  web:
    paths: [test/web]
    platforms: [chrome]

# The memory benchmark spawns subprocesses and takes several seconds. It is
# skipped by the default run; run it with:
#   dart test --run-skipped -t benchmark
tags:
  benchmark:
    skip: "Heavy; run with: dart test --run-skipped -t benchmark"
