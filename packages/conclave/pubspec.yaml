name: conclave
version: 1.0.0
description: >-
  End-to-end encrypted, server-less, local-first CRDT sync engine for Dart:
  typed collections, queries, SQLite storage, device identity, sync protocol.
homepage: https://github.com/nodsoftware/conclave
repository: https://github.com/nodsoftware/conclave

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  crdt: ^5.1.3
  crypto: ^3.0.6
  meta: ^1.18.0
  sqlite3: ^3.5.2

dev_dependencies:
  analyzer: '>=12.1.0 <15.0.0'
  lints: ^4.0.0
  test: ^1.25.0
