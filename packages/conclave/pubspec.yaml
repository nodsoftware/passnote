name: conclave
version: 1.0.0
description: >-
  End-to-end encrypted, local-first CRDT sync engine for Dart: port interfaces,
  the SQLite-backed engine, typed collections, device identity, the wire
  protocol, and an in-memory transport for testing.
homepage: https://github.com/nodsoftware/conclave
repository: https://github.com/nodsoftware/conclave

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  crdt: ^5.1.3
  crypto: ^3.0.6
  meta: ^1.18.0
  sqlite3: ^3.5.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
