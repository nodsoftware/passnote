  conclave_lan: ^1.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
