homepage: https://github.com/nodsoftware/conclave
repository: https://github.com/nodsoftware/conclave
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  conclave: ^1.0.0
