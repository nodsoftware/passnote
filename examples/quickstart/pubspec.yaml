name: quickstart
version: 0.1.0
description: The getting-started walkthrough as a compiled example. Kept in sync with docs/start-here/tutorial.md.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  passnote: ^1.1.0
  passnote_flutter: ^1.1.0
  flutter:
    sdk: flutter
  provider: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  passnote_generator: ^1.1.0
  lints: ^4.0.0

# At-rest encryption: build package:sqlite3's native library from the
# SQLCipher source. Read from the root package, so keep this stanza when
# copying the example out of the workspace; without it, openDatabase throws
# SqlCipherUnavailableException instead of storing plaintext.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
