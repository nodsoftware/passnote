name: shopping_list_bloc
version: 0.1.0
description: Shopping list example app using Passnote with BLoC state management.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  bloc: ^9.0.0
  passnote_flutter: ^1.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0

dev_dependencies:
  build_runner: ^2.15.0
  passnote_generator: ^1.0.0
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

# At-rest encryption: build package:sqlite3's native library from the
# SQLCipher source. Read from the root package, so keep this stanza when
# copying the example out of the workspace; without it, openDatabase throws
# SqlCipherUnavailableException instead of storing plaintext.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
