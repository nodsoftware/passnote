[project]
site_name = "Passnote"
site_url = "https://nodsoftware.github.io/passnote/"
site_description = """
End-to-end encrypted, server-less, local-first CRDT sync engine for Dart and \
Flutter."""
site_author = "Passnote contributors"
copyright = "&copy; 2026 Passnote contributors"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/nodsoftware/passnote"
repo_name = "nodsoftware/passnote"
extra_css = ["stylesheets/passnote.css"]

nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    "start-here/index.md",
    "start-here/tutorial.md",
  ] },
  { "Guides" = [
    "guides/index.md",
    "guides/set-up-platforms.md",
    "guides/pair-a-device.md",
    "guides/revoke-a-device.md",
    "guides/rotate-the-passphrase.md",
    "guides/choose-field-types.md",
    "guides/query-and-paginate.md",
    "guides/run-on-the-web.md",
    "guides/recover-from-a-lost-passphrase.md",
    "guides/troubleshoot-sync.md",
    "guides/test-your-app.md",
    "guides/contributing.md",
  ] },
  { "Concepts" = [
    "concepts/data-model.md",
    "concepts/clocks-and-merge.md",
    "concepts/sync.md",
    "concepts/identity.md",
    "concepts/glossary.md",
  ] },
  { "Reference" = [
    "reference/builder.md",
    "reference/ports.md",
    "reference/transports.md",
    "reference/wire-protocol.md",
    "reference/sqlite-schema.md",
    "reference/limits.md",
    "reference/crypto-vectors.md",
  ] },
  { "Security" = "security.md" },
]

# getting-started.md is intentionally NOT in nav: it is a stub redirect kept at
# the old URL, pointing to start-here/tutorial.md.

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.instant",
  "navigation.instant.progress",
  "toc.follow",
  "content.code.copy",
]
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"

# Brand fonts (SIL OFL): Source Sans 3, the wordmark's face, for text and
# headings.
[project.theme.font]
text = "Source Sans 3"
code = "Source Code Pro"

# Colours come from the brand palette in stylesheets/passnote.css, so both
# schemes use the "custom" primary and accent.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }
