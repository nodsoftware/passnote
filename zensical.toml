[project]
site_name = "Conclave"
site_url = "https://nodsoftware.github.io/conclave/"
site_description = """
End-to-end encrypted, server-less, local-first CRDT sync engine for Dart and \
Flutter."""
site_author = "Conclave contributors"
copyright = "&copy; 2026 Conclave contributors"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/nodsoftware/conclave"
repo_name = "nodsoftware/conclave"

nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    "start-here/index.md",
    "start-here/tutorial.md",
  ] },
  { "Guides" = [
    "guides/index.md",
    "guides/pair-a-device.md",
    "guides/revoke-a-device.md",
    "guides/choose-field-types.md",
    "guides/query-and-paginate.md",
    "guides/run-on-the-web.md",
    "guides/recover-from-a-lost-passphrase.md",
    "guides/contributing.md",
  ] },
  { "Concepts" = [
    "concepts/data-model.md",
    "concepts/clocks-and-merge.md",
    "concepts/sync.md",
    "concepts/identity.md",
    "concepts/glossary.md",
  ] },
  { "Reference" = [
    "reference/builder.md",
    "reference/ports.md",
    "reference/transports.md",
    "reference/wire-protocol.md",
    "reference/sqlite-schema.md",
  ] },
  { "Security" = "security.md" },
]

# getting-started.md is intentionally NOT in nav: it is a stub redirect kept at
# the old URL, pointing to start-here/tutorial.md.

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.instant",
  "navigation.instant.progress",
  "toc.follow",
  "content.code.copy",
]
